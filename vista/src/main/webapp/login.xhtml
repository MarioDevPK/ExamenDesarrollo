<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>SAUAP - Iniciar Sesión</title>
    <h:outputStylesheet name="css/style.css" />
</h:head>
<h:body styleClass="login-page">

    <h:form id="loginForm">

        <div class="login-card">

            <div class="login-logo">
                <span class="pi pi-graduation-cap logo-icon"></span>
                <div class="logo-text">
                    <span class="logo-title">SAUAP</span>
                    <span class="logo-subtitle">ASIGNACIÓN DOCENTE INSTITUCIÓN.</span>
                </div>
            </div>

            <h1 class="login-title">Iniciar Sesión</h1>

            <p:messages id="mensajes" showDetail="true" closable="true" />

            <div class="form-group">
                <label for="usuario">Usuario</label>
                <span class="p-input-icon-left field-full">
                    <i class="pi pi-id-card" />
                    <p:inputText id="usuario"
                                 value="#{loginBeanUI.usuario}"
                                 placeholder="Ej. user123"
                                 styleClass="field-full" />
                </span>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="contrasenia">Contraseña</label>
                    <h:outputLink value="#" styleClass="forgot-link">¿Olvidaste tu contraseña?</h:outputLink>
                </div>
                <span class="p-input-icon-left field-full">
                    <i class="pi pi-lock" />
                    <p:password id="contrasenia"
                                value="#{loginBeanUI.contrasenia}"
                                placeholder="••••••••••••"
                                feedback="false"
                                toggleMask="true"
                                styleClass="field-full" />
                </span>
            </div>

            <p:commandButton value="Entrar"
                              icon="pi pi-arrow-right"
                              iconPos="right"
                              action="#{loginBeanUI.login}"
                              styleClass="btn-entrar"
                              ajax="true"
                              update="mensajes" />

        </div>

        <div class="login-footer">© 2026 SAUAP</div>

    </h:form>

</h:body>
</html>
